<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax</title>
</head>
<body>
    <button id="get">GET요청</button>
    <button id="post">POST요청</button>
    <button id="clear">지우기</button>
    <pre id="content"></pre> 
    
    <script>
        // Ajax : 비동기로 다른곳에 무언가를 요청
        // GET 요청, POST요청
        // get 요청의 경우 내용이 다 보여서 받음, 긴문자는 짤려서 받아짐짐
        document.getElementById('get').addEventListener('click', function(){
             // fetch를 사용하여 다른사이트 요청을 받아옴옴   
             fetch('https://httpbin.org/get')
             .then(받아온거 => 받아온거.text())
             .then(데이터 => {
                document.getElementById('content').innerHTML = 데이터
             })
        })

        document.getElementById('clear').addEventListener('click', function(){
            document.getElementById('content').innerHTML = ' ';
        })

        // 화살표 함수 
        // function(){}
        // () => {} 가 있어야 하지만 한개인경우 생략 가능능
        // (한개) => {}

        // post 요청(보안, 긴문자)
        document.getElementById('post').addEventListener('click', ()=>{
             fetch('https://httpbin.org/post', {
                method: 'POST',
                headers:{
                    'Content-Type' : 'application/json'
                },
                body:JSON.stringify({
                    
                })
             })
             .then(받은거=>{
                // 다 받을때까지 기다린다음에
                // json형태로 만들어서 return으로 밑에 전달
                return 받은거.json()    // return하면 밑에 then에게 전달

             })            
             .then((다받은거)=>{
                document.getElementById('content').innerHTML = JSON.stringify(다받은거)
             })
            })
    </script>
</body>
</html>
