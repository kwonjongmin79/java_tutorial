<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 형태</title>
</head>
<body>
    <h1 class="num"></h1>
    <h1 class="num"></h1>
    <h1 class="num"></h1>

    <script>
        // 배열 : 변수들을 뭉쳐놓은 것
        var 숫자1 = 1
        var 숫자2 = 2
        var 숫자3 = 3

        // 숫자 셋트 [배열]
        var 배열 = [1, 9, 5] // 배열은 []로 감싸야 한다.
        //배열은 0번부터 시작하기때문에 주의의
        // 클레스 이름으로 찾을려면 배열형태로 사용용
        document.getElementsByClassName("num")[0].innerHTML = 배열[0] // 배열[0] : 배열의 첫번째 값
        document.getElementsByClassName("num")[1].innerHTML = 배열[1] // 배열[1] : 배열의 두번째 값
        document.getElementsByClassName("num")[2].innerHTML = 배열[2] // 배열[2] : 배열의 세번째 값

    </script>
</body>
</html>
