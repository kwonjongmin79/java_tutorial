<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>this</title>
</head>
<body>
     <button id="btn">클릭릭!</button>           
    <script>
        // this : 이곳 , 이것 뜻으로 사용
        console.log (this)   // window(전체범위) 들어있음

        
        function 함수() {  // 함수 제작 사용X
            console.log(this) // window(전체범위) 들어있음
        }
        // document.getElementById('btn').addEventListener('click', function(){alert(this)})    // html button element 안에 있다고 나옴

        document.getElementById('btn').addEventListener('click', ()=>{alert(this)})    // window 범위 안에 있다고 나옴  // 2015년 이후 wiondw(전체범위) 로 표기되게 변경할수 있게 ()=>함수를 제공하게 되었음, 하여 일회용 및 안에 넣어서 사용시 function 아닌 ()=>로 사용 필요

        let 오브젝트1 = {'키' : '값', 
            '일반함수' : function(){console.log(this)},   // 오브젝트1 가리키는 범위
            '화살표함수' : ()=>{console.log(this)}}          // window 가리키는 범위
            // 객체(오브젝트) 안에 함수를 만들때에는 일반함수를 넣어서 사용

        // 오브젝트1.일반함수
        오브젝트1.화살표함수

        

    </script>

</body>
</html>
