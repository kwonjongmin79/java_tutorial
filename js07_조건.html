<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조건</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        input {
            box-sizing: border-box;
            padding: 2px 4px;
            outline: none;
            margin-bottom: 5px;
            width: 60px;
        }
        .정답 {
            border: 2px solid yellowgreen;
        }
        .오답 {
            border: 2px solid red;
        }
        input[type="submit"] {
            width: auto;
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>수학 퀴즈</h1>
    <form>
        <label for="퀴즈1">7 ＋ 5 = </label>
        <input type="number" id="퀴즈1"/>
        <br/><br/>

        <label for="퀴즈2">2 × 8 = </label>
        <input type="number" id="퀴즈2"/>
        <br/><br/>
        
        <label for="퀴즈3">8 ÷ 2 = </label>
        <input type="number" id="퀴즈3"/>
        <br/><br/>
        
        <input type="button" value="제출" onclick="제출함수()"/>
    </form>
    
 
    <script>
           // 프로그래밍 언어에는 조건문 존재
        // 상황에 따라서 다른 결과를 보여주기 위해 사용
        // if(조건문) { 조건이 참일 때 실행할 코드 } else { 조건이 거짓일 때 실행할 코드 }
        function 제출함수(){
            // 사용자가 입력한 값 가져오기
            var 정답1 = document.getElementById('퀴즈1').value;
            var 정답2 = document.getElementById('퀴즈2').value;
            var 정답3 = document.getElementById('퀴즈3').value;
            
            // 기존 정답/오답 클래스 제거
            document.getElementById('퀴즈1').classList.remove('정답');
            document.getElementById('퀴즈1').classList.remove('오답');
            document.getElementById('퀴즈2').classList.remove('정답');
            document.getElementById('퀴즈2').classList.remove('오답');
            document.getElementById('퀴즈3').classList.remove('정답');
            document.getElementById('퀴즈3').classList.remove('오답');
            
            // 입력된 정답이 맞는지 확인하는 코드 작성  
            if(정답1 == 12){
                // 정답1에 입력한 값이 12가 맞다면 이쪽의 코드 실행
                document.getElementById('퀴즈1').classList.add('정답'); // 정답일 때
            }
            else{
                // 조건이 맞지 않으면 (정답1이 12가 아니면)
                document.getElementById('퀴즈1').classList.add('오답');
            }
            
            if(정답2 == 16){
                // 정답2에 입력한 값이 16이 맞다면 이쪽의 코드 실행
                document.getElementById('퀴즈2').classList.add('정답'); // 정답일 때
            }
            else{
                // 조건이 맞지 않으면 (정답2가 16이 아니면)
                document.getElementById('퀴즈2').classList.add('오답');
            }
            
            if(정답3 == 4){
                // 정답3에 입력한 값이 4가 맞다면 이쪽의 코드 실행
                document.getElementById('퀴즈3').classList.add('정답'); // 정답일 때
            }
            else{
                // 조건이 맞지 않으면 (정답3이 4가 아니면)
                document.getElementById('퀴즈3').classList.add('오답');
            }
        }
    </script>
</body>
</html>
