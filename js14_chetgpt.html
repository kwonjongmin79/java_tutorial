<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chet Gpt 앱</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-image: url(./img/kakao.png);
            background-position: center; /*가운데 부터 이미지 출력*/
            background-repeat: no-repeat ; /* 비어있는부분은 비어있게 설정 */
            min-height: 100vh; /* 최소사이즈를 100퍼센트로 보여줘줘 */
            width: 100%; /* 사이즈 100%로 */
            background-size: cover; /* 화면에 보이는 만큼 가득 채우기 */
        }

    </style>
</head>
<body>
    <div class="fixed-div">
        <div class="relative-div">
            <form>
                <input type="text" id="prompt">
                <button type="submit" id="submit-btn">▶</button>
            </form>
        </div>
    </div>
    
    <pre id="pre"></pre>
    <script>
        let 이미실행중 = false
        // chetgpt에 fetch를 통해서 질문을 보내고
        // 응답을 기다리게 한다음에 다 받으면 화면에 뿌려주기기
        
        // 외부사이트에 요청하고 응답을 받아와야하기 때문에 aync function으로 제작
        // 응답을 기다려야하기 때문에 await
        async function 보내기() {
            event.preventDefault(); // 이벤트가 새로고침안되게
            // 버튼을 누르면 input에 있는 value를 가져온다.
            let 입력값 = document.getElementById('prompt').value;
            if(입력값{
                document.getElementById('prompt').value = ''; // 입력된 값을 지워주는 코드
              if(이미실행중 === false){
                  이미실행중 = true; // 중복실행 차단용
                  document.getElementById('submit-btn').innerHTML = '■'
                  document.getElementById('pre').innerHTML += "\n\n사용자: " + 입력값
                //GPT에 질문 보내기
               let 응답결과 = await fetch('https://api.openai.com/v1/chat/completions',{
                method: 'POST',
                headers{
                    "content-Type" : "application/json"
                    
                },
                 body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: [{ role: "developer", content: "You are a helpful assistant." 
                        
                    },
                    {
                        "role": "user",
                        "content" : 입력값
                    }
                    ]

                  })

               })     
                
            }  
        });
        let 제이슨 = await 응답결과.json() 
        let text = 제이슨?.choices?.[0].message?.content ?? "내용이 없습니다." 
        document.getElementById('pre').innerHTML += "\n\nCHATGPT: " + text
        // https://platform.openai.com/docs/api-reference/chat/create
        // https://api.openai.com/v1/chat/completions [post 요청]
        
        
        // 다끝나고
        이미실행중 = false;
    }
    </script>
</body>
</html>
